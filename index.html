<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Big Beautiful Rose 🌹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  let progress = 0;
  const maxProgress = 1.0;

  function drawRose() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2 + 30; // إزاحة خفيفة للأسفل لتتوازن الوردة في منتصف الشاشة
    
    // مقاس كبير وعملاق للوردة بملء الشاشة
    const scale = Math.min(canvas.width, canvas.height) / 480;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. رسم الساق والأوراق الخضراء الكبيرة
    if (progress > 0.05) {
      ctx.save();
      ctx.translate(cx, cy);
      
      // الساق الناعمة
      ctx.beginPath();
      ctx.moveTo(0, 30 * scale);
      ctx.bezierCurveTo(-15 * scale, 160 * scale, 20 * scale, 280 * scale, 0, 380 * scale);
      ctx.lineWidth = 10 * scale;
      ctx.strokeStyle = "#1b5e20";
      ctx.shadowColor = "rgba(27, 94, 32, 0.5)";
      ctx.shadowBlur = 15;
      ctx.stroke();

      // الورقة اليسرى
      if (progress > 0.2) {
        ctx.beginPath();
        ctx.moveTo(-8 * scale, 170 * scale);
        ctx.bezierCurveTo(-110 * scale, 120 * scale, -140 * scale, 210 * scale, -8 * scale, 230 * scale);
        ctx.fillStyle = "#2e7d32";
        ctx.shadowColor = "rgba(46, 125, 50, 0.4)";
        ctx.shadowBlur = 10;
        ctx.fill();
      }

      // الورقة اليمنى
      if (progress > 0.3) {
        ctx.beginPath();
        ctx.moveTo(8 * scale, 240 * scale);
        ctx.bezierCurveTo(110 * scale, 190 * scale, 140 * scale, 280 * scale, 8 * scale, 300 * scale);
        ctx.fillStyle = "#1b5e20";
        ctx.fill();
      }
      ctx.restore();
    }

    // 2. رسم البتلات الحمراء المخملية ثلاثية الأبعاد بملء الشاشة
    if (progress > 0.1) {
      ctx.save();
      ctx.translate(cx, cy - 90 * scale);

      const petalCount = 1400; // عدد بتلات كثيف لإعطاء مظهر ممتلئ وجميل جداً
      const currentPetals = Math.floor(petalCount * Math.min(progress, 1));

      for (let i = 0; i < currentPetals; i++) {
        const theta = i * 0.08;
        const r = (240 * scale) * Math.pow(Math.sin(theta * 0.45), 2) * (1 - 0.18 * Math.cos(theta * 3));
        
        const x = r * Math.cos(theta);
        const y = -r * Math.sin(theta) * 0.82 + (theta * 1.8 * scale);

        // تدرج ألوان مخملي دافئ من التوتي الداكن إلى الأحمر الياقوتي البراق
        const red = Math.floor(210 + 45 * Math.sin(i * 0.04));
        const green = Math.floor(5 + 15 * Math.sin(i * 0.02));
        const blue = Math.floor(20 + 25 * Math.cos(i * 0.03));

        ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
        ctx.beginPath();
        ctx.arc(x, y, (12 - (i / petalCount) * 8.5) * scale, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    if (progress < maxProgress) {
      progress += 0.007;
      requestAnimationFrame(drawRose);
    }
  }

  drawRose();
</script>
</body>
</html>
