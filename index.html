<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart & Rose For You ❤️🌹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const totalPoints = 360;
  let i = 0;

  function draw() {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    
    // تكبير إطار القلب الخارجي ليتسع للوردة والكلمات
    const scale = Math.min(canvas.width, canvas.height) / 25;

    if (i < totalPoints) {
      const a = 2 * Math.PI * i / totalPoints;
      
      const xo = 16 * Math.pow(Math.sin(a), 3) * scale;
      const yo = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;

      // تحديد حدود الرسم ليبقى مركز القلب نظيفاً
      const L = 0.05 + Math.random() * 0.15;
      const xi = xo * (1 - L);
      const yi = yo * (1 - L);

      for (let j = 0; j < 8; j++) {
        const f = j / 8;
        const r = 255;
        const g = Math.floor((1 - f) * 30);
        const b = Math.floor((1 - f) * 60);

        ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(centerX + xo + (xi - xo) * f, centerY + yo + (yi - yo) * f);
        ctx.lineTo(centerX + xo + (xi - xo) * (f + 0.1), centerY + yo + (yi - yo) * (f + 0.1));
        ctx.stroke();
      }

      i++;
      setTimeout(draw, 10);
    } else {
      // تفريغ منطقة الوسط تماماً بدائرة سوداء لضمان وضوح الوردة والخط
      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(centerX, centerY - scale * 0.5, scale * 11.5, 0, Math.PI * 2);
      ctx.fill();

      // تحديد حجم الخط والوردة المعتمد على أبعاد الشاشة
      const baseFontSize = Math.max(13, Math.floor(Math.min(canvas.width, canvas.height) / 26));
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // إضافة ظل ناعم وبروز للوردة والكتابة
      ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
      ctx.shadowBlur = 8;

      // 1. رسم وردة حمراء كبيرة بارزة في الأعلى
      const roseSize = baseFontSize * 2.8;
      ctx.font = `${roseSize}px sans-serif`;
      ctx.fillText("🌹", centerX, centerY - (baseFontSize * 6.2));

      // 2. العبارة الرئيسية (خط أبيض عريض وواضح)
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${baseFontSize * 1.25}px system-ui, sans-serif`;

      const line1 = "سلامة قلبك وجسدك يا حبيبتي،";
      const line2 = "لو كان الأمر بايدي لأخذت التعب عنكِ";
      const line3 = "لتضلي دائمًا بخير ❤️";

      const lineHeight = baseFontSize * 1.48;
      ctx.fillText(line1, centerX, centerY - (lineHeight * 3.2));
      ctx.fillText(line2, centerX, centerY - (lineHeight * 1.9));
      ctx.fillText(line3, centerX, centerY - (lineHeight * 0.6));

      // 3. قصيدة النهر (خط ذهبي كبير وبسماكة عالية)
      ctx.fillStyle = "#ffdb4d";
      ctx.font = `bold ${baseFontSize * 0.9}px system-ui, sans-serif`;

      const poemLines = [
        "إذا كان ثمة نهر أكثرُ جمالًا من هذا اللون الوردي",
        "كالقمر الدموي.. إذا كان ثمة نهر أكثرُ وفاءً",
        "من هذه العودة الشهرية إلى النبع ذاته..",
        "إذا كان ثمة نهر أكثرُ شجاعةً من هذا التدفق",
        "الآتي في شغف وألم.. إذا كان ثمة نهر أكثرُ قِدَمًا",
        "من ابنة حواء أم هابيل وقابيل.. إذا كان في الكون نهرٌ",
        "إذا كان في الكون مياه أكثرُ قوةً من هذه المياه الجموح",
        "فلنُصلِ بأن تتدفق أيضًا عبر المخلوقات",
        "جميلة، وعتيقة، ووفية، وشجاعة، وأنثوية"
      ];

      poemLines.forEach((line, index) => {
        ctx.fillText(line, centerX, centerY + (lineHeight * 1.0) + (index * lineHeight * 0.95));
      });
    }
  }

  draw();
</script>
</body>
</html>
