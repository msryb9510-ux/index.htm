<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slow Animated Heart 💞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .heart-text {
            position: absolute;
            font-weight: bold;
            animation: fadeIn 1.5s ease-in-out infinite alternate;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.9);
            user-select: none;
            white-space: nowrap;
        }
        @keyframes fadeIn {
            from { opacity: 0.4; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.1); }
        }
        .center-msg {
            position: absolute;
            color: #ff3366;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            z-index: 10;
            line-height: 1.6;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.9);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="heartContainer">
        <div class="center-msg">سلامة قلبك وجسدك يا حبيبتي<br>لو كان الأمر بايدي لأخذت التعب عنكِ</div>
    </div>

    <script>
        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime", 
            "Ich liebe dich", "أحبك", "Я тебя люблю", "Kocham cię", 
            "Mahal kita", "사랑해", "Te quiero", "Ti amo"
        ];

        const container = document.getElementById('heartContainer');
        const numPoints = 140;

        // تكبير مقياس القلب ليناسب الشاشة تماماً
        const scale = Math.min(window.innerWidth, window.innerHeight) / 22;

        for (let i = 0; i < numPoints; i++) {
            let t = Math.random() * Math.PI * 2;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

            x = x * scale;
            y = y * scale;

            let span = document.createElement('span');
            span.className = 'heart-text';
            span.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            
            let offsetX = (Math.random() - 0.5) * 20;
            let offsetY = (Math.random() - 0.5) * 20;

            span.style.left = `calc(50% + ${x + offsetX}px)`;
            span.style.top = `calc(50% + ${y + offsetY}px)`;
            
            let red = Math.floor(Math.random() * 55) + 200;
            let green = Math.floor(Math.random() * 40);
            let blue = Math.floor(Math.random() * 80);
            span.style.color = `rgb(${red}, ${green}, ${blue})`;
            
            // أحجام واضحة وكبيرة للكلمات
            span.style.fontSize = `${Math.floor(Math.random() * 5) + 12}px`;
            
            container.appendChild(span);
        }
    </script>
</body>
</html>
