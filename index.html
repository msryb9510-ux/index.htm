<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غزول</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      cursor: pointer;
      user-select: none;
    }
    img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <img id="gallery" src="" alt="عرض الصور">

  <script>
    let images = [];
    
    async function loadGallery() {
      try {
        const response = await fetch('https://api.github.com/repos/msryb9510-ux/index.htm/contents');
        const data = await response.json();
        
        images = data
          .filter(file => file.name.endsWith('.jpg') || file.name.endsWith('.png') || file.name.endsWith('.jpeg'))
          .map(file => file.name);
          
        if (images.length > 0) {
          document.getElementById("gallery").src = images[0];
        }
      } catch (e) {
        console.error(e);
      }
    }

    let currentIndex = 0;
    const imgElement = document.getElementById("gallery");

    document.body.addEventListener("click", () => {
      if (images.length > 0) {
        currentIndex = (currentIndex + 1) % images.length;
        imgElement.src = images[currentIndex];
      }
    });

    loadGallery();
  </script>
</body>
</html>
