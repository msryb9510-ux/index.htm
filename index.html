<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Heart Pattern 💖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }

  // دالة حساب منحنى القلب المأخوذة من كود بايثون
  function heart(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    return { x: x, y: y };
  }

  function draw() {
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // ضبط المقياس ليتناسب مع حجم شاشة الجوال أو الكمبيوتر
    const SCALE = Math.min(canvas.width, canvas.height) / 45;
    const N = 140;
    const K = 2.1;
    const steps = 14;

    const bright = [0.95, 0.15, 0.1];
    const dark = [0.03, 0.0, 0.0];

    for (let i = 0; i < N; i++) {
      const ang = 2 * Math.PI * i / N;
      const h = heart(ang);
      
      // تحويل الإحداثيات لتناسب نظام Canvas (قلب محور y)
      const hx = h.x * SCALE;
      const hy = -h.y * SCALE;

      const ex = hx * K;
      const ey = hy * K;

      let prevX = cx + hx;
      let prevY = cy + hy;

      for (let j = 0; j < steps; j++) {
        const f = (j + 1) / steps;
        
        // حساب التدرج اللونية نفس كود بايثون
        const r = Math.floor((bright[0] + (dark[0] - bright[0]) * f) * 255);
        const g = Math.floor((bright[1] + (dark[1] - bright[1]) * f) * 255);
        const b = Math.floor((bright[2] + (dark[2] - bright[2]) * f) * 255);

        const currX = cx + hx + (ex - hx) * f;
        const currY = cy + hy + (ey - hy) * f;

        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(currX, currY);
        ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        prevX = currX;
        prevY = currY;
      }
    }
  }

  window.addEventListener('resize', resize);
  resize();
</script>

</body>
</html>
