<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Red Rose 🌹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .rose-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    /* رسم وردة أنيقة وفائقة الوضوح باستخدام عناصر CSS المباشرة */
    .rose {
      position: relative;
      width: 200px;
      height: 200px;
      transform: scale(1.4);
    }
    .petal {
      position: absolute;
      width: 80px;
      height: 120px;
      background: linear-gradient(to top, #800000, #ff1a1a);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
      top: 20px;
      left: 60px;
      transform-origin: bottom center;
    }
    .p1 { transform: rotate(0deg) scale(0.9); }
    .p2 { transform: rotate(45deg) scale(0.9); }
    .p3 { transform: rotate(90deg) scale(0.9); }
    .p4 { transform: rotate(135deg) scale(0.9); }
    .p5 { transform: rotate(180deg) scale(0.9); }
    .p6 { transform: rotate(225deg) scale(0.9); }
    .p7 { transform: rotate(270deg) scale(0.9); }
    .p8 { transform: rotate(315deg) scale(0.9); }
    
    .center-petal {
      position: absolute;
      width: 50px;
      height: 70px;
      background: radial-gradient(circle, #ff4d4d 0%, #990000 100%);
      border-radius: 50%;
      top: 55px;
      left: 75px;
      box-shadow: inset 0 0 10px #000;
    }
    .stem {
      position: absolute;
      width: 8px;
      height: 180px;
      background: linear-gradient(to right, #1e4d2b, #2e7d32);
      top: 170px;
      left: 96px;
      border-radius: 4px;
      z-index: -1;
    }
    .leaf {
      position: absolute;
      width: 45px;
      height: 25px;
      background: #2e7d32;
      border-radius: 0 100px 0 100px;
      top: 220px;
      left: 100px;
      transform: rotate(-15deg);
    }
  </style>
</head>
<body>

<div class="rose-container">
  <div class="rose">
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="petal p6"></div>
    <div class="petal p7"></div>
    <div class="petal p8"></div>
    <div class="center-petal"></div>
    <div class="stem"></div>
    <div class="leaf"></div>
  </div>
</div>

</body>
</html>
