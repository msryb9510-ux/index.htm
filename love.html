<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart 💞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .heart-text {
            position: absolute;
            font-weight: bold;
            white-space: nowrap;
            animation: fadeIn 1.5s ease-in-out infinite alternate;
            text-shadow: 0 0 6px rgba(255, 0, 50, 0.9);
            user-select: none;
            transform: translate(-50%, -50%);
        }
        @keyframes fadeIn {
            from { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }
        .center-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3366;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            width: 85%;
            line-height: 1.6;
            text-shadow: 0 0 15px rgba(255, 51, 102, 1);
            z-index: 20;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="heartContainer">
        <div class="center-msg">سلامة قلبك وجسدك يا حبيبتي<br>لو كان الأمر بايدي لأخذت التعب عنكِ</div>
    </div>

    <script>
        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime", 
            "Ich liebe dich", "أحبك", "Я тебя люблю", "Kocham cię", 
            "Mahal kita", "사랑해", "Te quiero", "Ti amo"
        ];

        const container = document.getElementById('heartContainer');
        const numPoints = 130;

        function renderHeart() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            // مقياس مرن يضمن ظهور الشكل كاملاً داخل الشاشة مهما كان حجمها
            const scale = Math.min(w, h) / 30;

            for (let i = 0; i < numPoints; i++) {
                let t = (i / numPoints) * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                let posX = (w / 2) + (x * scale);
                let posY = (h / 2) + (y * scale);

                let span = document.createElement('span');
                span.className = 'heart-text';
                span.innerText = phrases[Math.floor(Math.random() * phrases.length)];

                span.style.left = `${posX}px`;
                span.style.top = `${posY}px`;
                
                let red = Math.floor(Math.random() * 55) + 200;
                span.style.color = `rgb(${red}, 20, 60)`;
                span.style.fontSize = `${Math.floor(Math.random() * 4) + 11}px`;
                
                container.appendChild(span);
            }
        }

        renderHeart();
    </script>
</body>
</html>
